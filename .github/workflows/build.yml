name: Build Roblox iOS Optimizer Dylib

"on":
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Codesign arm64 Dylib
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode Developer path:"
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid
          which ldid

      - name: Compile RobloxOptimizer.dylib
        run: |
          mkdir -p build
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          xcrun -sdk iphoneos clang \
            -target arm64-apple-ios14.0 \
            -arch arm64 \
            -shared \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -Wall \
            -Wextra \
            -isysroot "${SDK_PATH}" \
            -install_name @rpath/RobloxOptimizer.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework Metal \
            -framework QuartzCore \
            -Isrc \
            -o build/RobloxOptimizer.dylib \
            src/ROEntry.m \
            src/Config/ROConfig.m \
            src/Hooks/ROMetalHooks.m \
            src/Hooks/ROResolutionHooks.m \
            src/FFlags/ROFastFlags.m \
            src/UI/ROPassThroughWindow.m \
            src/UI/ROFloatingButton.m \
            src/UI/ROMenuViewController.m

      - name: Pseudo-Ad-Hoc Codesign with ldid
        run: |
          ldid -S build/RobloxOptimizer.dylib
          file build/RobloxOptimizer.dylib
          otool -L build/RobloxOptimizer.dylib

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxOptimizer-dylib
          path: build/RobloxOptimizer.dylib
          if-no-files-found: error

      - name: Create Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/RobloxOptimizer.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
